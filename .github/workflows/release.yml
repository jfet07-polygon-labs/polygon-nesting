name: Release candidate

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful main CI run ID containing exact release evidence
        required: false
        type: string
  push:
    tags:
      - v0.1.1

permissions:
  contents: read
  actions: read

jobs:
  authorize-source:
    name: Authorize immutable source
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      source-commit: ${{ steps.source.outputs.result }}
    steps:
      - name: Verify GitHub-validated signed tag or capture dispatch source
        id: source
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          result-encoding: string
          script: |
            if (context.ref.startsWith('refs/tags/')) {
              const tagName = context.ref.slice('refs/tags/'.length);
              const { data: ref } = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tagName}`
              });
              if (ref.object.type !== 'tag') {
                core.setFailed('Release tags must be annotated and signed; lightweight tags are rejected');
                return;
              }
              const { data: tag } = await github.rest.git.getTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_sha: ref.object.sha
              });
              if (!tag.verification.verified || tag.verification.reason !== 'valid') {
                core.setFailed(`GitHub did not verify the release tag signature: ${tag.verification.reason}`);
                return;
              }
              if (tag.object.type !== 'commit') {
                core.setFailed('The verified tag must point directly to a commit');
                return;
              }
              return tag.object.sha;
            }
            return context.sha;

  resolve-ci:
    name: Resolve matching main CI evidence
    needs: authorize-source
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      run-id: ${{ steps.resolve.outputs.result }}
    steps:
      - name: Resolve successful main push CI run and release artifacts
        id: resolve
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        env:
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          SOURCE_COMMIT: ${{ needs.authorize-source.outputs.source-commit }}
        with:
          result-encoding: string
          script: |
            const requiredArtifacts = new Set([
              'native-build-linux-x64',
              'native-build-darwin-arm64',
              `oci-build-${process.env.SOURCE_COMMIT}`
            ]);
            async function validateRun(run) {
              if (run.head_sha !== process.env.SOURCE_COMMIT || run.conclusion !== 'success' || run.event !== 'push' || run.head_branch !== 'main' || !run.path.endsWith('/ci.yml')) return false;
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
                per_page: 100
              });
              const names = new Set(data.artifacts.filter(artifact => !artifact.expired).map(artifact => artifact.name));
              return names.size === requiredArtifacts.size && [...requiredArtifacts].every(name => names.has(name));
            }
            const supplied = process.env.CI_RUN_ID;
            if (supplied) {
              if (!/^[1-9][0-9]*$/.test(supplied)) {
                core.setFailed('ci_run_id must be a positive integer');
                return;
              }
              const { data: run } = await github.rest.actions.getWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: Number(supplied)
              });
              if (!await validateRun(run)) {
                core.setFailed('The supplied run is not a successful main push ci.yml run with exact release evidence for this source commit');
                return;
              }
              return supplied;
            }
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              branch: 'main',
              head_sha: process.env.SOURCE_COMMIT,
              event: 'push',
              status: 'completed',
              per_page: 100
            });
            for (const run of data.workflow_runs) {
              if (await validateRun(run)) return String(run.id);
            }
            core.setFailed('No successful main push CI run with exact release evidence exists for the source commit');

  candidate:
    name: Assemble npm release candidate
    needs: [authorize-source, resolve-ci]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    env:
      SOURCE_COMMIT: ${{ needs.authorize-source.outputs.source-commit }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.authorize-source.outputs.source-commit }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.0
      - name: Download native build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.resolve-ci.outputs.run-id }}
          pattern: native-build-*
          path: downloaded-native-artifacts
      - name: Normalize two published native build artifact directories
        run: |
          mkdir native-artifacts
          for target in linux-x64 darwin-arm64; do
            source="downloaded-native-artifacts/native-build-$target"
            test -d "$source"
            test ! -e "native-artifacts/$target"
            mv "$source" "native-artifacts/$target"
          done
          test "$(find native-artifacts -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')" = 2
      - name: Assemble candidate without compiling
        run: node scripts/assemble-release-candidate.mjs --artifacts native-artifacts --output release-candidate --source-commit "$SOURCE_COMMIT" --trusted-source-root "$GITHUB_WORKSPACE"
      - name: Validate npm candidate offline
        run: node scripts/verify-release-candidate.mjs --candidate release-candidate --trusted-source-root "$GITHUB_WORKSPACE"
      - name: Require deterministic release notes
        run: test -s release-candidate/RELEASE_NOTES.md
      - name: Upload immutable npm candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: npm-release-candidate-${{ needs.authorize-source.outputs.source-commit }}
          path: release-candidate
          if-no-files-found: error
          retention-days: 90

  oci:
    name: Reuse verified OCI candidate archive
    needs: [authorize-source, resolve-ci, candidate]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    env:
      SOURCE_COMMIT: ${{ needs.authorize-source.outputs.source-commit }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.authorize-source.outputs.source-commit }}
          persist-credentials: false
      - name: Download npm candidate evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: npm-release-candidate-${{ needs.authorize-source.outputs.source-commit }}
          path: release-candidate
      - name: Download exact OCI build evidence from main CI
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.resolve-ci.outputs.run-id }}
          name: oci-build-${{ needs.authorize-source.outputs.source-commit }}
          path: oci-candidate
      - name: Validate combined candidate evidence offline without rebuilding
        run: >-
          node scripts/verify-release-candidate.mjs
          --candidate release-candidate
          --trusted-source-root "$GITHUB_WORKSPACE"
          --oci-archive oci-candidate/oci-image.tar
          --oci-evidence oci-candidate/oci-evidence.json
      - name: Upload exact immutable OCI archive and evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oci-release-candidate-${{ needs.authorize-source.outputs.source-commit }}
          path: oci-candidate
          if-no-files-found: error
          retention-days: 90
