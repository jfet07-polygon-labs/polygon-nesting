name: Publish runtime image

on:
  workflow_run:
    workflows:
      - Request runtime image publication
    types:
      - completed

permissions:
  contents: read
  actions: read
  packages: write

concurrency:
  group: runtime-image-publish
  queue: max
  cancel-in-progress: false

jobs:
  publish:
    name: Publish verified runtime image
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment: publish
    env:
      IMAGE_REPOSITORY: ghcr.io/jfet07-polygon-labs/polygon-nesting
      IMAGE_TAG: ghcr.io/jfet07-polygon-labs/polygon-nesting:0.1.0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Download publication request
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          name: runtime-image-publication-request
          path: publication-request

      - name: Validate selected release run and exact artifacts
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(find publication-request -type f | wc -l | tr -d ' ')" = 1
          test -f publication-request/release-run-id.txt
          RELEASE_RUN_ID="$(tr -d '\r\n' < publication-request/release-run-id.txt)"
          export RELEASE_RUN_ID
          if ! printf '%s' "$RELEASE_RUN_ID" | grep -Eq '^[1-9][0-9]*$'; then
            printf '%s\n' 'release_run_id must be a positive integer' >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID" > release-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID/artifacts?per_page=100" > release-artifacts.json
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'

          const run = JSON.parse(readFileSync('release-run.json', 'utf8'))
          if (run.path !== '.github/workflows/release.yml' || run.status !== 'completed' || run.conclusion !== 'success' || run.repository?.full_name !== process.env.GITHUB_REPOSITORY) {
            throw new Error('release_run_id must identify a successful completed release.yml run in this repository')
          }
          if (!/^[a-f0-9]{40}$/.test(run.head_sha ?? '')) throw new Error('release run head_sha must be a full lowercase commit ID')
          const inventory = JSON.parse(readFileSync('release-artifacts.json', 'utf8'))
          const expected = [
            `npm-release-candidate-${run.head_sha}`,
            `oci-release-candidate-${run.head_sha}`
          ].sort()
          const actual = (inventory.artifacts ?? []).map(({ name }) => name).sort()
          if (inventory.total_count !== expected.length || JSON.stringify(actual) !== JSON.stringify(expected)) {
            throw new Error(`release run must contain exactly ${JSON.stringify(expected)}`)
          }
          for (const artifact of inventory.artifacts) {
            if (!Number.isSafeInteger(artifact.id) || artifact.id <= 0 || artifact.expired !== false) {
              throw new Error(`release artifact is invalid: ${artifact.name}`)
            }
          }
          writeFileSync('source-metadata.json', `${JSON.stringify({ sourceCommit: run.head_sha }, null, 2)}\n`)
          NODE
          source_commit="$(node --input-type=module -e "import {readFileSync} from 'node:fs'; process.stdout.write(JSON.parse(readFileSync('source-metadata.json','utf8')).sourceCommit)" )"
          gh api "repos/$GITHUB_REPOSITORY/compare/$source_commit...main" > source-main-comparison.json
          SOURCE_COMMIT="$source_commit" node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'

          const sourceCommit = process.env.SOURCE_COMMIT
          const comparison = JSON.parse(readFileSync('source-main-comparison.json', 'utf8'))
          if (comparison.base_commit?.sha !== sourceCommit || (comparison.status !== 'ahead' && comparison.status !== 'identical')) {
            throw new Error('release run source commit must be reachable from trusted main')
          }
          NODE
          printf 'source_commit=%s\n' "$source_commit" >> "$GITHUB_OUTPUT"
          printf 'RELEASE_RUN_ID=%s\n' "$RELEASE_RUN_ID" >> "$GITHUB_ENV"

      - name: Preserve trusted publication verifier
        run: |
          set -euo pipefail
          verifier_root="$RUNNER_TEMP/trusted-publication-verifier"
          mkdir -p "$verifier_root"
          git archive --format=tar HEAD | tar -xf - -C "$verifier_root"
          test -f "$verifier_root/scripts/verify-runtime-publication.mjs"
          test -f "$verifier_root/scripts/smoke-cli-image.sh"

      - name: Checkout selected release source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ steps.source.outputs.source_commit }}
          persist-credentials: false

      - name: Download selected npm release evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.RELEASE_RUN_ID }}
          name: npm-release-candidate-${{ steps.source.outputs.source_commit }}
          path: release-candidate

      - name: Download selected OCI release evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.RELEASE_RUN_ID }}
          name: oci-release-candidate-${{ steps.source.outputs.source_commit }}
          path: oci-candidate

      - name: Verify release evidence and OCI archive without rebuilding
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.source_commit }}
        run: >-
          node "$RUNNER_TEMP/trusted-publication-verifier/scripts/verify-runtime-publication.mjs"
          --candidate release-candidate
          --trusted-source-root "$GITHUB_WORKSPACE"
          --oci-archive oci-candidate/oci-image.tar
          --oci-evidence oci-candidate/oci-evidence.json
          --manifest-digest oci-candidate/manifest-digest.txt
          --source-commit "$SOURCE_COMMIT"
          --source-run-id "$RELEASE_RUN_ID"
          > runtime-verification.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.0
          registry-url: https://npm.pkg.github.com
          scope: '@jfet07-polygon-labs'

      - name: Inspect immutable npm package version
        id: npm-state
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NPM_TARBALL="$(node --input-type=module -e "import {readFileSync} from 'node:fs'; import {basename,join} from 'node:path'; const release=JSON.parse(readFileSync('release-candidate/release.json','utf8')); if(release.package?.name!=='@jfet07-polygon-labs/polygon-nesting'||release.package?.version!=='0.1.0'||basename(release.tarball?.fileName??'')!==release.tarball?.fileName) throw new Error('release npm identity is invalid'); process.stdout.write(join('release-candidate',release.tarball.fileName))")"
          test -f "$NPM_TARBALL"
          NPM_TARBALL="$NPM_TARBALL" node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto'
          import { readFileSync, writeFileSync } from 'node:fs'

          const bytes = readFileSync(process.env.NPM_TARBALL)
          writeFileSync('expected-npm-dist.json', `${JSON.stringify({
            shasum: createHash('sha1').update(bytes).digest('hex'),
            integrity: `sha512-${createHash('sha512').update(bytes).digest('base64')}`
          }, null, 2)}\n`)
          NODE
          set +e
          npm view "@jfet07-polygon-labs/polygon-nesting@0.1.0" --json --registry https://npm.pkg.github.com > npm-registry.json 2> npm-registry-error.log
          view_status=$?
          set -e
          if [ "$view_status" -ne 0 ]; then
            if grep -q 'E404' npm-registry-error.log; then
              printf 'null\n' > npm-registry.json
            else
              cat npm-registry-error.log >&2
              exit "$view_status"
            fi
          fi
          action="$(node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'

          const expected = JSON.parse(readFileSync('expected-npm-dist.json', 'utf8'))
          const existing = JSON.parse(readFileSync('npm-registry.json', 'utf8'))
          if (existing === null) process.stdout.write('publish')
          else if (existing.dist?.shasum === expected.shasum && existing.dist?.integrity === expected.integrity) process.stdout.write('skip')
          else throw new Error('refusing to replace an existing npm version with different bytes')
          NODE
          )"
          printf 'action=%s\n' "$action" >> "$GITHUB_OUTPUT"
          printf 'NPM_TARBALL=%s\n' "$NPM_TARBALL" >> "$GITHUB_ENV"

      - name: Install skopeo
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends skopeo

      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Inspect immutable runtime tag
        id: oci-state
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.source_commit }}
        run: |
          set -euo pipefail
          MANIFEST_DIGEST="$(node --input-type=module -e "import {readFileSync} from 'node:fs'; process.stdout.write(JSON.parse(readFileSync('runtime-verification.json','utf8')).manifestDigest)" )"
          if ! printf '%s' "$MANIFEST_DIGEST" | grep -Eq '^sha256:[a-f0-9]{64}$'; then
            printf '%s\n' 'OCI evidence manifest digest is invalid' >&2
            exit 1
          fi
          IMAGE_REF="$IMAGE_REPOSITORY@$MANIFEST_DIGEST"
          set +e
          existing_digest="$(skopeo inspect --format '{{.Digest}}' "docker://$IMAGE_TAG" 2> tag-inspect-error.log)"
          inspect_status=$?
          set -e
          if [ "$inspect_status" -eq 0 ]; then
            if [ "$existing_digest" != "$MANIFEST_DIGEST" ]; then
              printf 'refusing to move existing tag to a different digest: %s != %s\n' "$existing_digest" "$MANIFEST_DIGEST" >&2
              exit 1
            fi
            action=skip
          elif grep -Eqi 'manifest unknown|name unknown|not found|404' tag-inspect-error.log; then
            action=publish
          else
            cat tag-inspect-error.log >&2
            exit "$inspect_status"
          fi
          printf 'action=%s\n' "$action" >> "$GITHUB_OUTPUT"
          printf 'SOURCE_COMMIT=%s\n' "$SOURCE_COMMIT" >> "$GITHUB_ENV"
          printf 'MANIFEST_DIGEST=%s\n' "$MANIFEST_DIGEST" >> "$GITHUB_ENV"
          printf 'IMAGE_REF=%s\n' "$IMAGE_REF" >> "$GITHUB_ENV"

      - name: Publish exact verified npm tarball
        if: steps.npm-state.outputs.action == 'publish'
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: npm publish "$NPM_TARBALL" --ignore-scripts --registry https://npm.pkg.github.com

      - name: Verify immutable npm package delivery
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          npm view "@jfet07-polygon-labs/polygon-nesting@0.1.0" --json --registry https://npm.pkg.github.com > published-npm-registry.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'

          const expected = JSON.parse(readFileSync('expected-npm-dist.json', 'utf8'))
          const published = JSON.parse(readFileSync('published-npm-registry.json', 'utf8'))
          if (published.dist?.shasum !== expected.shasum || published.dist?.integrity !== expected.integrity) {
            throw new Error('published npm package bytes differ from the verified release tarball')
          }
          NODE
          delivery_root="$RUNNER_TEMP/npm-delivery"
          rm -rf "$delivery_root"
          mkdir -p "$delivery_root"
          printf '{"private":true}\n' > "$delivery_root/package.json"
          (cd "$delivery_root" && npm install --ignore-scripts --no-audit --no-fund --save-exact "@jfet07-polygon-labs/polygon-nesting@0.1.0")
          DELIVERY_ROOT="$delivery_root" node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          import { createRequire } from 'node:module'
          import { join } from 'node:path'

          const load = createRequire(join(process.env.DELIVERY_ROOT, 'package.json'))
          const manifest = JSON.parse(readFileSync(join(process.env.DELIVERY_ROOT, 'node_modules/@jfet07-polygon-labs/polygon-nesting/package.json'), 'utf8'))
          if (manifest.name !== '@jfet07-polygon-labs/polygon-nesting' || manifest.version !== '0.1.0') {
            throw new Error('installed npm package identity is invalid')
          }
          load('@jfet07-polygon-labs/polygon-nesting')
          NODE

      - name: Publish exact verified runtime image
        if: steps.oci-state.outputs.action == 'publish'
        run: skopeo copy oci-archive:oci-candidate/oci-image.tar "docker://$IMAGE_TAG"

      - name: Verify immutable runtime image delivery
        run: |
          set -euo pipefail
          post_publication_digest="$(skopeo inspect --format '{{.Digest}}' "docker://$IMAGE_TAG")"
          if [ "$post_publication_digest" != "$MANIFEST_DIGEST" ]; then
            printf 'published tag digest mismatch: %s != %s\n' "$post_publication_digest" "$MANIFEST_DIGEST" >&2
            exit 1
          fi
          printf 'POST_PUBLICATION_DIGEST=%s\n' "$post_publication_digest" >> "$GITHUB_ENV"

      - name: Pull published image by digest
        run: docker pull "$IMAGE_REF"

      - name: Run runtime smoke test by digest
        run: >-
          "$RUNNER_TEMP/trusted-publication-verifier/scripts/smoke-cli-image.sh"
          "$IMAGE_REF"

      - name: Write publication evidence
        env:
          PUBLICATION_TIMESTAMP: ${{ github.run_started_at }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'

          const verification = JSON.parse(readFileSync('runtime-verification.json', 'utf8'))
          const release = JSON.parse(readFileSync('release-candidate/release.json', 'utf8'))
          const npmDist = JSON.parse(readFileSync('expected-npm-dist.json', 'utf8'))
          const evidence = {
            schemaVersion: 1,
            sourceRunId: process.env.RELEASE_RUN_ID,
            sourceCommit: process.env.SOURCE_COMMIT,
            archiveSha256: verification.archiveSha256,
            manifestDigest: verification.manifestDigest,
            tag: process.env.IMAGE_TAG,
            immutableImageReference: process.env.IMAGE_REF,
            postPublicationDigest: process.env.POST_PUBLICATION_DIGEST,
            npmPackage: {
              name: release.package.name,
              version: release.package.version,
              registry: 'https://npm.pkg.github.com',
              shasum: npmDist.shasum,
              integrity: npmDist.integrity
            },
            actor: process.env.GITHUB_ACTOR,
            repository: process.env.GITHUB_REPOSITORY,
            workflowRunId: process.env.GITHUB_RUN_ID,
            timestamp: process.env.PUBLICATION_TIMESTAMP,
            smoke: { passed: true, imageReference: process.env.IMAGE_REF }
          }
          writeFileSync('publication-evidence.json', `${JSON.stringify(evidence, null, 2)}\n`)
          NODE

      - name: Upload publication evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-publication-evidence-${{ github.run_id }}
          path: publication-evidence.json
          if-no-files-found: error
          retention-days: 90
