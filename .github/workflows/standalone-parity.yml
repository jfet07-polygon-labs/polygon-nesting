name: Standalone parity gate

on:
  workflow_call:
    inputs:
      source-run:
        description: Source jfet07-polygon-labs/min-plane-dxf workflow run ID
        required: true
        type: string
      parity-bundle-path:
        description: Fixed output path for trusted parity input
        required: true
        type: string
  workflow_dispatch:
    inputs:
      source-run:
        description: Source jfet07-polygon-labs/min-plane-dxf workflow run ID
        required: true
        type: string

permissions:
  contents: read
  actions: read
  attestations: read

jobs:
  parity:
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: linux-x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            executable-suffix: ''
          - key: win32-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            executable-suffix: '.exe'
          - key: darwin-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            executable-suffix: ''
          - key: darwin-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            executable-suffix: ''
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_TERM_COLOR: always
      PARITY_BUNDLE_ROOT: ${{ inputs.parity-bundle-path || 'artifacts/trusted-parity-bundle' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}
      - name: Fetch matching attested old-side bundle
        shell: bash
        run: node scripts/parity/fetch-source-parity-bundle.mjs --source-run "${{ inputs.source-run }}" --target "${{ matrix.target }}" --output "$PARITY_BUNDLE_ROOT/${{ matrix.target }}" --provenance-output "$RUNNER_TEMP/standalone-parity-provenance/${{ matrix.key }}.json"
      - name: Build locked release parity executables
        shell: bash
        run: >-
          cargo build --locked --release --target "${{ matrix.target }}"
          -p polygon-nesting-cli --bin polygon-nesting
          -p polygon-nesting-napi --bin parity-desktop-request-adapter
          --bin parity-project-engine-outcome --bin parity-project-engine-events
      - name: Build and stage standalone N-API package
        shell: bash
        run: node packages/polygon-nesting/scripts/build-native.mjs --release --target "${{ matrix.target }}"
      - name: Capture standalone N-API and neutral CLI parity
        shell: bash
        run: >-
          node scripts/parity/run-old-new-parity.mjs
          --old-root "$PARITY_BUNDLE_ROOT/${{ matrix.target }}"
          --new-root "$RUNNER_TEMP/standalone-parity/${{ matrix.key }}"
          --package "packages/polygon-nesting/npm/index.cjs"
          --target "${{ matrix.target }}"
          --target-key "${{ matrix.key }}"
          --source-revision "$GITHUB_SHA"
          --adapter "target/${{ matrix.target }}/release/parity-desktop-request-adapter${{ matrix.executable-suffix }}"
          --cli "target/${{ matrix.target }}/release/polygon-nesting${{ matrix.executable-suffix }}"
          --outcome-projector "target/${{ matrix.target }}/release/parity-project-engine-outcome${{ matrix.executable-suffix }}"
          --events-projector "target/${{ matrix.target }}/release/parity-project-engine-events${{ matrix.executable-suffix }}"
          --evidence "$RUNNER_TEMP/standalone-parity/${{ matrix.key }}/parity.json"
          --source-provenance-evidence "$RUNNER_TEMP/standalone-parity-provenance/${{ matrix.key }}.json"
      - name: Upload one verified target evidence bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: old-new-parity-target-${{ matrix.key }}
          path: ${{ runner.temp }}/standalone-parity/${{ matrix.key }}
          if-no-files-found: error
          retention-days: 7
  aggregate:
    needs: parity
    if: ${{ needs.parity.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Download exactly four target bundles
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: old-new-parity-target-*
          path: ${{ runner.temp }}/old-new-parity-targets
          merge-multiple: false
      - name: Assemble deterministic aggregate parity archive
        shell: bash
        run: >-
          node scripts/parity/assemble-parity-aggregate.mjs
          --input "$RUNNER_TEMP/old-new-parity-targets"
          --output "$RUNNER_TEMP/old-new-parity-bundle"
          --source-revision "$GITHUB_SHA"
          --trusted-source-root "$GITHUB_WORKSPACE"
      - name: Upload exact aggregate artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: old-new-parity-bundle
          path: |-
            ${{ runner.temp }}/old-new-parity-bundle/old-new-parity-bundle.tar.gz
            ${{ runner.temp }}/old-new-parity-bundle/old-new-parity-bundle.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Attest aggregate parity archive
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45
        with:
          subject-path: ${{ runner.temp }}/old-new-parity-bundle/old-new-parity-bundle.tar.gz
  require-all-targets:
    if: always()
    needs: [parity, aggregate]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every target parity bundle and aggregate
        shell: bash
        run: >-
          test "${{ needs.parity.result }}" = success &&
          test "${{ needs.aggregate.result }}" = success
