name: Setup safe Rust cache
description: Cache Cargo dependency sources and configure sccache without persisting build output

runs:
  using: composite
  steps:
    - name: Restore Cargo dependency cache
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
        key: rust-cache-v1-${{ runner.os }}-${{ runner.arch }}-rust-1.95.0-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          rust-cache-v1-${{ runner.os }}-${{ runner.arch }}-rust-1.95.0-
    - name: Verify pinned sccache
      shell: bash
      env:
        SCCACHE_BOOTSTRAP_TARGET_DIR: ${{ runner.temp }}/sccache-bootstrap
        SCCACHE_VERSION: 0.10.0
      run: node scripts/ensure-sccache.mjs
    - name: Export GitHub Actions cache credentials
      uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
      with:
        script: |
          const cacheUrl = process.env.ACTIONS_RESULTS_URL || process.env.ACTIONS_CACHE_URL
          const runtimeToken = process.env.ACTIONS_RUNTIME_TOKEN
          if (!cacheUrl || !runtimeToken) {
            core.setFailed('GitHub Actions cache runtime credentials are unavailable')
            return
          }
          core.exportVariable('ACTIONS_RESULTS_URL', cacheUrl)
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', runtimeToken)
          core.exportVariable('ACTIONS_CACHE_SERVICE_V2', process.env.ACTIONS_CACHE_SERVICE_V2 || '')
    - name: Configure sccache
      shell: bash
      run: |
        printf '%s\n' 'RUSTC_WRAPPER=sccache' >> "$GITHUB_ENV"
        printf '%s\n' 'SCCACHE_GHA_ENABLED=true' >> "$GITHUB_ENV"
        printf '%s\n' 'CARGO_INCREMENTAL=0' >> "$GITHUB_ENV"
