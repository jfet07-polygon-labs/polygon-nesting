name: Setup safe Rust cache
description: Cache Cargo dependency sources and configure sccache without persisting build output

runs:
  using: composite
  steps:
    - name: Restore Cargo dependency cache
      uses: actions/cache@0c45773b623bea8c8e75f6c82b208c3cf94ea4f9
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
        key: rust-cache-v1-${{ runner.os }}-${{ runner.arch }}-rust-1.95.0-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          rust-cache-v1-${{ runner.os }}-${{ runner.arch }}-rust-1.95.0-
    - name: Verify pinned sccache
      shell: bash
      env:
        SCCACHE_BOOTSTRAP_TARGET_DIR: ${{ runner.temp }}/sccache-bootstrap
        SCCACHE_VERSION: 0.10.0
      run: node scripts/ensure-sccache.mjs
    - name: Configure sccache
      shell: bash
      run: |
        printf '%s\n' 'RUSTC_WRAPPER=sccache' >> "$GITHUB_ENV"
        printf '%s\n' 'SCCACHE_GHA_ENABLED=true' >> "$GITHUB_ENV"
        printf '%s\n' 'CARGO_INCREMENTAL=0' >> "$GITHUB_ENV"
