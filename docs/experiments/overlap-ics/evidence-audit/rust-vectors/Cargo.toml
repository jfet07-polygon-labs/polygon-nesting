# A **detached** package: the empty `[workspace]` table below takes it out of
# the repository workspace on purpose, so nothing under `crates/` changes and
# `cargo build` at the root is byte-for-byte the build the gates measured.
#
# It exists because three of the audit's six subsystems can only be checked
# from inside the crate - the strike helper's transition table, the
# clearance/pivot convention family, and Algorithm 8's weight schedule - and
# checking them from a test *inside* `overlap_ics` would be checking the tree
# against itself. This binary links the shipped library and recomputes each of
# them by a second route written from the spec text.
[package]
name = "overlap-ics-evidence-audit"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
polygon-nesting-core = { path = "../../../../../crates/polygon-nesting-core", features = ["overlap-ics"] }
serde_json = "1"

[[bin]]
name = "audit"
path = "src/main.rs"

[profile.release]
overflow-checks = true
