[package]
name = "polygon-nesting-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "polygon-nesting"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
nix = { version = "0.31", features = ["fs", "resource", "user"] }
polygon-nesting-core = { path = "../polygon-nesting-core" }
polygon-nesting-dxf = { path = "../polygon-nesting-dxf" }
polygon-nesting-protocol = { path = "../polygon-nesting-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
signal-hook-registry = "1.4.1"

[target.'cfg(not(unix))'.dependencies]
ctrlc = { version = "3", features = ["termination"] }

[dev-dependencies]
jsonschema = { version = "0.49.9", default-features = false }
