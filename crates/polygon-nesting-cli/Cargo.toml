[package]
name = "polygon-nesting-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "polygon-nesting"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
nix = { version = "0.31", features = ["fs", "resource", "user"] }
polygon-nesting-core = { path = "../polygon-nesting-core" }
polygon-nesting-protocol = { path = "../polygon-nesting-protocol" }
serde_json = "1"
