[package]
name = "polygon-nesting-core"
version.workspace = true
edition.workspace = true

[features]
default = []
# Compiles the optional `jagua-rs` dependency in. It gates two independent
# experiments now - the `general_hazard` dynamic-hazard adapter and the
# `search::kernel::jagua` exploration-kernel skeleton - and one feature covers
# both deliberately: they share the same pinned version, the same conversion
# contract, and the same open question (whether an f32 engine can rank
# candidates for us). A second feature would let a build carry the dependency's
# licence, size, and toolchain surface while exercising only half of it.
#
# Off by default, and it stays off until the dependency clears the gates in
# docs/next-generation-engine-plan.md. Neither consumer is reachable from a
# production route, and neither may answer an exact or publication question.
jagua-experimental = ["dep:jagua-rs"]
# Installs the counting global allocator in the benchmark example. Off by
# default so that a normal profiling run measures the phase counters alone and
# heap numbers are collected in a separate, deliberately slower build.
profiling-allocator = []
# Compiles the deep-operator (`general_persistent_vacancy`) phase spans in.
# Off by default: those sites sit inside a generated function whose inlining
# they perturb, which costs about 4.5% of a mode-20 stream even with recording
# switched off. See `profiling::deep` for the measurement behind this.
search-profiling = []
# Compiles the relaxed lane's candidate-scorer census in: three coarse spans
# and five counters inside `general_relaxed`'s generic `score_placement`.
# Off by default and a measurement build only - the scorer runs about four
# million times per mode-20 stream, so the spans are a real fraction of what
# they measure. Its counters are exact; its milliseconds are a decomposition
# and never a wall-clock claim. See `profiling::census` and
# docs/experiments/relaxed-lane-residual/.
relaxed-lane-census = []
# Compiles the portfolio coordinator's opportunity-and-delayed-credit ledger,
# and the A/B/C probe phase that spends one action from the state the schedule
# saturated at.
#
# Off by default and off in every shipping path. The ledger is an instrument:
# it runs once, after the last phase, and reads the archive - it never feeds a
# schedule decision, and it costs `O(members^2 * pieces)` hybrid fingerprints,
# which is cheap at exit and is not something a production run should pay for
# nothing. The probe is an extra phase after the drain; with the feature off
# neither the phase nor any branch reaching it is compiled, so a default build
# is the shipping schedule exactly. See docs/experiments/opportunity-ledger/.
portfolio-ledger = []
# Resolves the relaxed lane's candidate shape once per candidate scan instead
# of twice. The broad-phase probe needs the candidate's bounds, which live in
# the oriented shape the scan then resolves again; this reuses the first
# resolution for both. Off by default, like `fast-constructor-reject`, so the
# default build is the one every pinned gate was measured on - but the arms are
# the same computation in the same order, so both reproduce all four gates as
# whole documents. See docs/experiments/relaxed-lane-residual/.
relaxed-scan-shape-reuse = []
# Answers the lane's per-pose bounds lookup out of the same rotation-key memo
# the candidate scan already uses, instead of re-deriving the key with
# `rem_euclid` on every call. Off by default and stacked on
# `relaxed-scan-shape-reuse`, like `fast-constructor-reject` is stacked on
# `fast-constructor-confirm`, so the two can be priced separately. Both arms
# read the same catalogue entry through the same key, so this is bit-identical
# as a whole document. See docs/experiments/relaxed-lane-residual/.
relaxed-cached-pose-bounds = []
# Recycles the candidate scorer's collision-row buffer instead of allocating a
# fresh `Vec` per scan. The refinement loop retires exactly two rows per
# iteration - the loser of the paired probe and the incumbent it displaced - and
# this hands both back to a small per-lane pool the next two scans take from.
# Same values, same order, same sort; only the buffer's capacity differs and no
# path reads a capacity, so it is bit-identical as a whole document. Off by
# default like every other lever in this family, so the default build is the one
# the pinned gates were measured on. See docs/experiments/relaxed-lane-residual/.
relaxed-row-buffer-reuse = []
# Orders a candidate scan's neighbours by a cheap separation proxy - the squared
# distance between the two placements' translation origins - instead of by piece
# index.
#
# This is a class (B) lever and it is NOT semantics-preserving: 82% of scans stop
# early on the caller's upper bound, so the visit order decides which rows land
# before the cutoff and therefore what the tracker installs, and it also changes
# the order the weighted-loss sum accumulates in. It must stay off in anything
# that publishes a comparable number until a matched-arm quality gate says
# otherwise. See docs/experiments/relaxed-lane-residual/.
relaxed-scan-order-proxy = []
# Compiles the quality frontier trace in: an event-driven JSONL record of every
# exact-valid candidate the search sees, with elapsed time, work ordinals,
# operator identity, parent fingerprint and disposition. See `quality_trace`.
#
# Off by default and empty when off - every entry point is a `#[cfg]` pair whose
# disabled half has no body, so the default build's generated code is unchanged.
# The armed build is a measurement build: it switches `profiling` recording on
# so the work ordinals are live, and that cost is measured rather than assumed
# in docs/experiments/quality-frontier-trace/.
quality-trace = []
# Compiles the shadow-rescore audit in: after every accepted move the relaxed
# sweep recomputes the complete layout score and compares it against the
# incrementally maintained one. See `search::shadow_rescore`.
#
# Off by default, and it is a measurement build rather than a slow production
# one: the audit roughly doubles a sweep's geometric work, and a build that
# carries it reports a `fullRescores` count and a `fullRescore` phase that
# describe the audit rather than the search.
shadow-rescore = []
# Makes a pair question a function of the *unordered* pair: whichever operand
# has the lower input index is asked first, in both proxy tiers and in both the
# collision verdict and the pressure magnitude.
#
# Off by default, and it must stay off in anything that publishes a comparable
# number. The proxy collider's narrow phase is not symmetric in its two
# operands - it tests the first operand's precomputed cell axes against the
# second's points in a frame relative to the first - so a marginal contact can
# collide asked one way round and not the other. A candidate scan asks
# `(moving, fixed)` and a whole-layout score asks `(lower, higher)`, which is
# why the incremental tracker has never equalled a from-scratch rescore.
#
# Enforcing one order is what makes a tracker row a measurement of the layout
# rather than of the path taken to it - the precondition for a sweep inheriting
# its predecessor's tracker - but it changes the value a candidate scan computes
# for a marginal pair, and therefore the search's trajectory. See
# `canonical_pair_operands` and the row-ownership entry in
# docs/next-generation-engine-plan.md.
canonical-pair-order = []
# Replaces the *proxy* tier's vector length with `sqrt(x * x + y * y)`.
#
# A MEASUREMENT build, not a candidate optimisation. Off by default, and the
# corpus evaluation it was delivered for has now been run and rejected it: the
# platform's `hypot` is correctly rounded and the naive form is not, so about
# one in six results differs in the last place, and on 20 of 22 corpus streams
# that moves the search's trajectory - on three of them as far as a reported
# layout 0.121 mm deeper. It must stay off in anything that publishes a
# comparable number, and it must not acquire a default or a settings knob. See
# `search::general_relaxed::proxy_hypot` for the verdict and the scope.
fast-proxy-hypot = []
# Replaces the mode-20/25 skyline constructor's trapped-void evaluator with an
# incremental bit-grid one: occupancy carried down the beam and updated by the
# one piece a child adds, scanline rasterisation, a `u64`-word flood fill,
# reusable buffers, and a cell size derived from the narrowest piece in the
# request rather than a fixed 2 mm.
#
# Off by default. The legacy evaluator's raster is a *different measurement* -
# a different cell size counts different cells - so this is not and cannot be a
# bit-identical change, and the mode-20 regression gate must be run against the
# default build. What the profile owes instead is per-seed determinism,
# unchanged exact-valid publication, and a quality gate measured as descendant
# depth under a fixed downstream work budget - never the constructor's own
# immediate depth, which the ledger repeatedly shows is an invalid proxy. See
# `search::construction_void_grid`.
fast-constructor-profile = []
# Asks the exploration kernel one fused question per candidate row -
# `ExplorationKernel::pair_row` - instead of a collision verdict followed by a
# separate pressure call.
#
# A MEASUREMENT build, not a behaviour flag. Both arms compute the same `f64`
# from the same operands in the same order, and the fused arm reproduces all
# four regression gates plus the four mode-31 and six mode-26 arms as whole
# documents - 14 of 14 - so the flag exists only to price the second trait
# entry.
#
# The price was measured, on ten-round interleaved A/Bs whose arms alternate
# order every round and whose statistic is the per-round paired ratio. Two
# independent samples of that A/B, fused against split:
#
#   sample 1: mode 22 median 1.007 (2 of 10 rounds below parity)
#             mode 0  median 0.994 (7 of 10)
#   sample 2: mode 22 median 0.998 (7 of 10)
#             mode 0  median 0.999 (6 of 10)
#
# Every median is within 0.7% of parity, every one is inside its own sample's
# spread, and mode 22 changes sign between the samples - which is what a real
# zero looks like, and why one sample would have been reported as a small
# regression. It is also the expected result: the legacy kernel's verdict walks
# a cell index and its magnitude walks a pole series, two disjoint structures
# built at catalogue time with nothing between them to share, so fusing the
# *call* saves one operand presentation and one index-ordered swap, and those
# were never the cost. The default therefore stays split. See the PR6 entry in
# docs/next-generation-engine-plan.md.
#
# The fused entry itself is unconditional and is the shape a kernel with a
# shared traversal will implement; only the lane's use of it is gated.
fused-pair-query = []
# Prefilters the skyline constructor's exact pair questions with a grid-exact
# separation certificate: the axis-aligned box plus the two diagonals, then a
# separating-axis test over both convex hulls, both computed on the integer
# Clipper path the exact query itself is executed on.
#
# The certificate answers "provably separated" or "no information", never
# "probably". A separated pair has zero intersection area, so the verdict this
# substitutes is the verdict the exact query would have returned; the poses the
# constructor accepts, and the Clipper queries that confirm them, are unchanged.
# A `debug_assert` on the skip path runs the exact query anyway and requires the
# area to be zero.
#
# Off by default, and stacked on `fast-constructor-profile` rather than folded
# into it so the two can be priced separately. It is not bit-identical as a
# *document*: fewer Clipper queries means smaller `clipperInputVertices` and
# `clipperOutputVertices` work diagnostics, which are quota quantities, so the
# mode-20 regression gate must be run against the default build. See
# `search::construction_confirm_shield`.
fast-constructor-confirm = []
# Rejects a skyline-constructor confirmation row before it builds anything, with
# an *inner* overlap certificate: discs inscribed in the parent's collision
# polygons and in the candidate's source polygon, the latter transformed
# rigidly to the pose and inflated by the collision expansion. Two discs that
# overlap prove the two collision polygons intersect in positive area, which is
# the verdict the exact tier would have returned - so the row returns `None`
# without the Clipper offset and without a single pair query.
#
# This is the direction the separation shield above cannot go. The census
# measured its ceiling at 22.67% because 77.3% of the constructor's exact
# queries are genuine overlaps; a proof of overlap is the only thing that
# reaches those, and it is also the only thing that reaches the 78.66% of
# collision-polygon builds spent on a pose the row then discards.
#
# The certificate answers "provably overlapping" or "no information". Every
# discretisation between the source ring and the Clipper path is charged as an
# explicit erosion of the certified radius, and a `debug_assert` on the reject
# path builds the collision polygon anyway and requires a positive exact area.
#
# Off by default and stacked, like `fast-constructor-confirm`, so the two can be
# priced separately. It is not bit-identical as a *document*: rows that never
# build never charge `experimentalCollisionBuilds`, `transformedCollisionVertices`
# or `clipperInputVertices`, which are quota quantities, so the regression gates
# must be run against the default build. See
# `search::construction_reject_certificate`.
fast-constructor-reject = []
# Compiles the constructor's exact-confirmation census in: a counting build
# that attributes every exact pair question and every collision-polygon build
# the constructor makes to its call path, and prices three *sound* separation
# prefilters against the exact answer on every pair that reaches Clipper.
#
# A measurement build and nothing else. It runs a convex hull per observed pair,
# so its clock is not the production clock and no time from it may be quoted.
# See `constructor_census`.
constructor-census = []
# Compiles the lane-owned compression schedule in: a depth clock the relaxed
# lane advances one canonical grid unit at a time, a monotone floor in the
# proxy tier, a deepest-confirmed slot, and persistent-vacancy mode 34, which
# drives them.
#
# Off by default, and the default build is byte-identical: the schedule is one
# `Option` field on `GeneralRelaxedSettings` that does not exist when the
# feature is off, one `#[cfg]`-paired call at the top of `move_sweep` whose
# disabled half has no body, and one match arm in the mode dispatch. Every
# existing caller constructs the settings without naming it, so `move_sweep`
# reads `state.strip_depth_mm` exactly as it does today and the four pinned
# gates reproduce bit-for-bit.
#
# It is not a bit-identical *behaviour* flag when armed: an armed lane writes a
# tightening depth into the state at every sweep entry, which changes the
# boundary penalty, the candidate sampling boxes and therefore the trajectory.
# That is the whole point of it, and it is why arming it needs a matched-arm
# quality gate rather than a document diff. See
# `search::compression_schedule` and docs/experiments/compression-schedule/.
compression-schedule = []
# A diagnostic-only companion to `general_micro_legalization`'s translation-only
# global program. It asks a different question from the repair pass: not "can
# this front be pushed open at all" but "how much shallower can the PUBLISHED
# depth be made, by a bounded SE(2) motion of every piece, without breaking
# anything else". See `search::general_micro_legalization::se2_certificate` and
# docs/experiments/se2-rigidity/.
#
# Off by default, and the default build contains none of it: the whole module is
# behind this `#[cfg]`, and the only thing it needs from the shipping path is
# `Approach`'s witness pair, which is itself behind the same gate so that
# neither the struct's size nor `measure_approach`'s work changes in a default
# build. `global_legalize` shares no code with the certificate's solver and no
# production path calls it.
#
# It never runs inside a request even when compiled in: the only caller is a
# CLI branch in `general_request_benchmark`, gated on the
# `POLYGON_NESTING_SE2_CERTIFICATE` environment variable exactly the way
# `POLYGON_NESTING_COMPRESSION_SCHEDULE` gates mode 34's knobs, so an armed
# build run without it is the shipping benchmark. The four pinned gates are run
# on both binaries to hold that.
se2-rigidity-certificate = []

[dependencies]
polygon-nesting-protocol = { path = "../polygon-nesting-protocol" }
num-bigint = "0.4"
libm = "0.2"
jagua-rs = { version = "=0.7.2", optional = true }
rayon = "1"
robust = "1.2.0"
ryu-js = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"

[[example]]
name = "general_hazard_benchmark"
path = "examples/general_hazard_benchmark.rs"
required-features = ["jagua-experimental"]
