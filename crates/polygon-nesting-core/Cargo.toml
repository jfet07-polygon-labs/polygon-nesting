[package]
name = "polygon-nesting-core"
version.workspace = true
edition.workspace = true

[features]
default = []
# Compiles the optional `jagua-rs` dependency in. It gates two independent
# experiments now - the `general_hazard` dynamic-hazard adapter and the
# `search::kernel::jagua` exploration-kernel skeleton - and one feature covers
# both deliberately: they share the same pinned version, the same conversion
# contract, and the same open question (whether an f32 engine can rank
# candidates for us). A second feature would let a build carry the dependency's
# licence, size, and toolchain surface while exercising only half of it.
#
# Off by default, and it stays off until the dependency clears the gates in
# docs/next-generation-engine-plan.md. Neither consumer is reachable from a
# production route, and neither may answer an exact or publication question.
jagua-experimental = ["dep:jagua-rs"]
# Installs the counting global allocator in the benchmark example. Off by
# default so that a normal profiling run measures the phase counters alone and
# heap numbers are collected in a separate, deliberately slower build.
profiling-allocator = []
# Compiles the deep-operator (`general_persistent_vacancy`) phase spans in.
# Off by default: those sites sit inside a generated function whose inlining
# they perturb, which costs about 4.5% of a mode-20 stream even with recording
# switched off. See `profiling::deep` for the measurement behind this.
search-profiling = []
# Compiles the shadow-rescore audit in: after every accepted move the relaxed
# sweep recomputes the complete layout score and compares it against the
# incrementally maintained one. See `search::shadow_rescore`.
#
# Off by default, and it is a measurement build rather than a slow production
# one: the audit roughly doubles a sweep's geometric work, and a build that
# carries it reports a `fullRescores` count and a `fullRescore` phase that
# describe the audit rather than the search.
shadow-rescore = []
# Makes a pair question a function of the *unordered* pair: whichever operand
# has the lower input index is asked first, in both proxy tiers and in both the
# collision verdict and the pressure magnitude.
#
# Off by default, and it must stay off in anything that publishes a comparable
# number. The proxy collider's narrow phase is not symmetric in its two
# operands - it tests the first operand's precomputed cell axes against the
# second's points in a frame relative to the first - so a marginal contact can
# collide asked one way round and not the other. A candidate scan asks
# `(moving, fixed)` and a whole-layout score asks `(lower, higher)`, which is
# why the incremental tracker has never equalled a from-scratch rescore.
#
# Enforcing one order is what makes a tracker row a measurement of the layout
# rather than of the path taken to it - the precondition for a sweep inheriting
# its predecessor's tracker - but it changes the value a candidate scan computes
# for a marginal pair, and therefore the search's trajectory. See
# `canonical_pair_operands` and the row-ownership entry in
# docs/next-generation-engine-plan.md.
canonical-pair-order = []
# Replaces the *proxy* tier's vector length with `sqrt(x * x + y * y)`.
#
# A MEASUREMENT build, not a candidate optimisation. Off by default, and the
# corpus evaluation it was delivered for has now been run and rejected it: the
# platform's `hypot` is correctly rounded and the naive form is not, so about
# one in six results differs in the last place, and on 20 of 22 corpus streams
# that moves the search's trajectory - on three of them as far as a reported
# layout 0.121 mm deeper. It must stay off in anything that publishes a
# comparable number, and it must not acquire a default or a settings knob. See
# `search::general_relaxed::proxy_hypot` for the verdict and the scope.
fast-proxy-hypot = []
# Asks the exploration kernel one fused question per candidate row -
# `ExplorationKernel::pair_row` - instead of a collision verdict followed by a
# separate pressure call.
#
# A MEASUREMENT build, not a behaviour flag. Both arms compute the same `f64`
# from the same operands in the same order, and the fused arm reproduces all
# four regression gates plus the four mode-31 and six mode-26 arms as whole
# documents - 14 of 14 - so the flag exists only to price the second trait
# entry.
#
# The price was measured, on ten-round interleaved A/Bs whose arms alternate
# order every round and whose statistic is the per-round paired ratio. Two
# independent samples of that A/B, fused against split:
#
#   sample 1: mode 22 median 1.007 (2 of 10 rounds below parity)
#             mode 0  median 0.994 (7 of 10)
#   sample 2: mode 22 median 0.998 (7 of 10)
#             mode 0  median 0.999 (6 of 10)
#
# Every median is within 0.7% of parity, every one is inside its own sample's
# spread, and mode 22 changes sign between the samples - which is what a real
# zero looks like, and why one sample would have been reported as a small
# regression. It is also the expected result: the legacy kernel's verdict walks
# a cell index and its magnitude walks a pole series, two disjoint structures
# built at catalogue time with nothing between them to share, so fusing the
# *call* saves one operand presentation and one index-ordered swap, and those
# were never the cost. The default therefore stays split. See the PR6 entry in
# docs/next-generation-engine-plan.md.
#
# The fused entry itself is unconditional and is the shape a kernel with a
# shared traversal will implement; only the lane's use of it is gated.
fused-pair-query = []

[dependencies]
polygon-nesting-protocol = { path = "../polygon-nesting-protocol" }
num-bigint = "0.4"
libm = "0.2"
jagua-rs = { version = "=0.7.2", optional = true }
rayon = "1"
robust = "1.2.0"
ryu-js = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"

[[example]]
name = "general_hazard_benchmark"
path = "examples/general_hazard_benchmark.rs"
required-features = ["jagua-experimental"]
