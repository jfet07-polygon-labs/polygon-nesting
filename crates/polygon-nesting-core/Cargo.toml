[package]
name = "polygon-nesting-core"
version.workspace = true
edition.workspace = true

[features]
default = []
# Compiles the optional `jagua-rs` dependency in. It gates two independent
# experiments now - the `general_hazard` dynamic-hazard adapter and the
# `search::kernel::jagua` exploration-kernel skeleton - and one feature covers
# both deliberately: they share the same pinned version, the same conversion
# contract, and the same open question (whether an f32 engine can rank
# candidates for us). A second feature would let a build carry the dependency's
# licence, size, and toolchain surface while exercising only half of it.
#
# Off by default, and it stays off until the dependency clears the gates in
# docs/next-generation-engine-plan.md. Neither consumer is reachable from a
# production route, and neither may answer an exact or publication question.
jagua-experimental = ["dep:jagua-rs"]
# Installs the counting global allocator in the benchmark example. Off by
# default so that a normal profiling run measures the phase counters alone and
# heap numbers are collected in a separate, deliberately slower build.
profiling-allocator = []
# **Instrument only.** A census of which publication gate refused, counted at
# the band entry in `separate`. It answers one question the funnel cannot: a
# bite that enters the proxy band thousands of times and never calls the exact
# authority is being refused by the digest guard, by the target-depth gate or
# by the improvement gate, and those have different causes. Counters only, no
# trajectory effect, off by default so no gate binary carries it.
ics-publish-census = []
# **The T-row repair** (`docs/t-row-repair-spec.md`, sha256
# `bce5c8bd...`). When a state is inside the 4 um band and 0 to 4 um proud of
# the locked strip's top, the existing frozen-theta repair is run with the strip
# top injected as a tightened far-y boundary row, and the layout may publish
# only if the repaired depth is at or below `T` and dual-valid. Off by default:
# the shipped build and every pinned gate carry none of it, and the arm is
# selected at runtime so a census build can hold Control, TRepair and
# ComputeIgnore side by side. Implies nothing; the 4 um band, the 16 um
# displacement cap, the 4n row cap, the Exclusive kernel at r = 2.500 and the
# contract validator are all unchanged.
t-row-repair = []
# Compiles the deep-operator (`general_persistent_vacancy`) phase spans in.
# Off by default: those sites sit inside a generated function whose inlining
# they perturb, which costs about 4.5% of a mode-20 stream even with recording
# switched off. See `profiling::deep` for the measurement behind this.
search-profiling = []
# Compiles the relaxed lane's candidate-scorer census in: three coarse spans
# and five counters inside `general_relaxed`'s generic `score_placement`.
# Off by default and a measurement build only - the scorer runs about four
# million times per mode-20 stream, so the spans are a real fraction of what
# they measure. Its counters are exact; its milliseconds are a decomposition
# and never a wall-clock claim. See `profiling::census` and
# docs/experiments/relaxed-lane-residual/.
relaxed-lane-census = []
# Compiles the portfolio coordinator's opportunity-and-delayed-credit ledger,
# and the A/B/C probe phase that spends one action from the state the schedule
# saturated at.
#
# Off by default and off in every shipping path. The ledger is an instrument:
# it runs once, after the last phase, and reads the archive - it never feeds a
# schedule decision, and it costs `O(members^2 * pieces)` hybrid fingerprints,
# which is cheap at exit and is not something a production run should pay for
# nothing. The probe is an extra phase after the drain; with the feature off
# neither the phase nor any branch reaching it is compiled, so a default build
# is the shipping schedule exactly. See docs/experiments/opportunity-ledger/.
portfolio-ledger = []
# Resolves the relaxed lane's candidate shape once per candidate scan instead
# of twice. The broad-phase probe needs the candidate's bounds, which live in
# the oriented shape the scan then resolves again; this reuses the first
# resolution for both. Off by default, like `fast-constructor-reject`, so the
# default build is the one every pinned gate was measured on - but the arms are
# the same computation in the same order, so both reproduce all four gates as
# whole documents. See docs/experiments/relaxed-lane-residual/.
relaxed-scan-shape-reuse = []
# Answers the lane's per-pose bounds lookup out of the same rotation-key memo
# the candidate scan already uses, instead of re-deriving the key with
# `rem_euclid` on every call. Off by default and stacked on
# `relaxed-scan-shape-reuse`, like `fast-constructor-reject` is stacked on
# `fast-constructor-confirm`, so the two can be priced separately. Both arms
# read the same catalogue entry through the same key, so this is bit-identical
# as a whole document. See docs/experiments/relaxed-lane-residual/.
relaxed-cached-pose-bounds = []
# Recycles the candidate scorer's collision-row buffer instead of allocating a
# fresh `Vec` per scan. The refinement loop retires exactly two rows per
# iteration - the loser of the paired probe and the incumbent it displaced - and
# this hands both back to a small per-lane pool the next two scans take from.
# Same values, same order, same sort; only the buffer's capacity differs and no
# path reads a capacity, so it is bit-identical as a whole document. Off by
# default like every other lever in this family, so the default build is the one
# the pinned gates were measured on. See docs/experiments/relaxed-lane-residual/.
relaxed-row-buffer-reuse = []
# Orders a candidate scan's neighbours by a cheap separation proxy - the squared
# distance between the two placements' translation origins - instead of by piece
# index.
#
# This is a class (B) lever and it is NOT semantics-preserving: 82% of scans stop
# early on the caller's upper bound, so the visit order decides which rows land
# before the cutoff and therefore what the tracker installs, and it also changes
# the order the weighted-loss sum accumulates in. It must stay off in anything
# that publishes a comparable number until a matched-arm quality gate says
# otherwise. See docs/experiments/relaxed-lane-residual/.
relaxed-scan-order-proxy = []
# Compiles the quality frontier trace in: an event-driven JSONL record of every
# exact-valid candidate the search sees, with elapsed time, work ordinals,
# operator identity, parent fingerprint and disposition. See `quality_trace`.
#
# Off by default and empty when off - every entry point is a `#[cfg]` pair whose
# disabled half has no body, so the default build's generated code is unchanged.
# The armed build is a measurement build: it switches `profiling` recording on
# so the work ordinals are live, and that cost is measured rather than assumed
# in docs/experiments/quality-frontier-trace/.
quality-trace = []
# Compiles the shadow-rescore audit in: after every accepted move the relaxed
# sweep recomputes the complete layout score and compares it against the
# incrementally maintained one. See `search::shadow_rescore`.
#
# Off by default, and it is a measurement build rather than a slow production
# one: the audit roughly doubles a sweep's geometric work, and a build that
# carries it reports a `fullRescores` count and a `fullRescore` phase that
# describe the audit rather than the search.
shadow-rescore = []
# Makes a pair question a function of the *unordered* pair: whichever operand
# has the lower input index is asked first, in both proxy tiers and in both the
# collision verdict and the pressure magnitude.
#
# Off by default, and it must stay off in anything that publishes a comparable
# number. The proxy collider's narrow phase is not symmetric in its two
# operands - it tests the first operand's precomputed cell axes against the
# second's points in a frame relative to the first - so a marginal contact can
# collide asked one way round and not the other. A candidate scan asks
# `(moving, fixed)` and a whole-layout score asks `(lower, higher)`, which is
# why the incremental tracker has never equalled a from-scratch rescore.
#
# Enforcing one order is what makes a tracker row a measurement of the layout
# rather than of the path taken to it - the precondition for a sweep inheriting
# its predecessor's tracker - but it changes the value a candidate scan computes
# for a marginal pair, and therefore the search's trajectory. See
# `canonical_pair_operands` and the row-ownership entry in
# docs/next-generation-engine-plan.md.
canonical-pair-order = []
# Replaces the *proxy* tier's vector length with `sqrt(x * x + y * y)`.
#
# A MEASUREMENT build, not a candidate optimisation. Off by default, and the
# corpus evaluation it was delivered for has now been run and rejected it: the
# platform's `hypot` is correctly rounded and the naive form is not, so about
# one in six results differs in the last place, and on 20 of 22 corpus streams
# that moves the search's trajectory - on three of them as far as a reported
# layout 0.121 mm deeper. It must stay off in anything that publishes a
# comparable number, and it must not acquire a default or a settings knob. See
# `search::general_relaxed::proxy_hypot` for the verdict and the scope.
fast-proxy-hypot = []
# Replaces the mode-20/25 skyline constructor's trapped-void evaluator with an
# incremental bit-grid one: occupancy carried down the beam and updated by the
# one piece a child adds, scanline rasterisation, a `u64`-word flood fill,
# reusable buffers, and a cell size derived from the narrowest piece in the
# request rather than a fixed 2 mm.
#
# Off by default. The legacy evaluator's raster is a *different measurement* -
# a different cell size counts different cells - so this is not and cannot be a
# bit-identical change, and the mode-20 regression gate must be run against the
# default build. What the profile owes instead is per-seed determinism,
# unchanged exact-valid publication, and a quality gate measured as descendant
# depth under a fixed downstream work budget - never the constructor's own
# immediate depth, which the ledger repeatedly shows is an invalid proxy. See
# `search::construction_void_grid`.
fast-constructor-profile = []
# Asks the exploration kernel one fused question per candidate row -
# `ExplorationKernel::pair_row` - instead of a collision verdict followed by a
# separate pressure call.
#
# A MEASUREMENT build, not a behaviour flag. Both arms compute the same `f64`
# from the same operands in the same order, and the fused arm reproduces all
# four regression gates plus the four mode-31 and six mode-26 arms as whole
# documents - 14 of 14 - so the flag exists only to price the second trait
# entry.
#
# The price was measured, on ten-round interleaved A/Bs whose arms alternate
# order every round and whose statistic is the per-round paired ratio. Two
# independent samples of that A/B, fused against split:
#
#   sample 1: mode 22 median 1.007 (2 of 10 rounds below parity)
#             mode 0  median 0.994 (7 of 10)
#   sample 2: mode 22 median 0.998 (7 of 10)
#             mode 0  median 0.999 (6 of 10)
#
# Every median is within 0.7% of parity, every one is inside its own sample's
# spread, and mode 22 changes sign between the samples - which is what a real
# zero looks like, and why one sample would have been reported as a small
# regression. It is also the expected result: the legacy kernel's verdict walks
# a cell index and its magnitude walks a pole series, two disjoint structures
# built at catalogue time with nothing between them to share, so fusing the
# *call* saves one operand presentation and one index-ordered swap, and those
# were never the cost. The default therefore stays split. See the PR6 entry in
# docs/next-generation-engine-plan.md.
#
# The fused entry itself is unconditional and is the shape a kernel with a
# shared traversal will implement; only the lane's use of it is gated.
fused-pair-query = []
# Prefilters the skyline constructor's exact pair questions with a grid-exact
# separation certificate: the axis-aligned box plus the two diagonals, then a
# separating-axis test over both convex hulls, both computed on the integer
# Clipper path the exact query itself is executed on.
#
# The certificate answers "provably separated" or "no information", never
# "probably". A separated pair has zero intersection area, so the verdict this
# substitutes is the verdict the exact query would have returned; the poses the
# constructor accepts, and the Clipper queries that confirm them, are unchanged.
# A `debug_assert` on the skip path runs the exact query anyway and requires the
# area to be zero.
#
# Off by default, and stacked on `fast-constructor-profile` rather than folded
# into it so the two can be priced separately. It is not bit-identical as a
# *document*: fewer Clipper queries means smaller `clipperInputVertices` and
# `clipperOutputVertices` work diagnostics, which are quota quantities, so the
# mode-20 regression gate must be run against the default build. See
# `search::construction_confirm_shield`.
fast-constructor-confirm = []
# Rejects a skyline-constructor confirmation row before it builds anything, with
# an *inner* overlap certificate: discs inscribed in the parent's collision
# polygons and in the candidate's source polygon, the latter transformed
# rigidly to the pose and inflated by the collision expansion. Two discs that
# overlap prove the two collision polygons intersect in positive area, which is
# the verdict the exact tier would have returned - so the row returns `None`
# without the Clipper offset and without a single pair query.
#
# This is the direction the separation shield above cannot go. The census
# measured its ceiling at 22.67% because 77.3% of the constructor's exact
# queries are genuine overlaps; a proof of overlap is the only thing that
# reaches those, and it is also the only thing that reaches the 78.66% of
# collision-polygon builds spent on a pose the row then discards.
#
# The certificate answers "provably overlapping" or "no information". Every
# discretisation between the source ring and the Clipper path is charged as an
# explicit erosion of the certified radius, and a `debug_assert` on the reject
# path builds the collision polygon anyway and requires a positive exact area.
#
# Off by default and stacked, like `fast-constructor-confirm`, so the two can be
# priced separately. It is not bit-identical as a *document*: rows that never
# build never charge `experimentalCollisionBuilds`, `transformedCollisionVertices`
# or `clipperInputVertices`, which are quota quantities, so the regression gates
# must be run against the default build. See
# `search::construction_reject_certificate`.
fast-constructor-reject = []
# Compiles the constructor's exact-confirmation census in: a counting build
# that attributes every exact pair question and every collision-polygon build
# the constructor makes to its call path, and prices three *sound* separation
# prefilters against the exact answer on every pair that reaches Clipper.
#
# A measurement build and nothing else. It runs a convex hull per observed pair,
# so its clock is not the production clock and no time from it may be quoted.
# See `constructor_census`.
constructor-census = []
# Compiles the lane-owned compression schedule in: a depth clock the relaxed
# lane advances one canonical grid unit at a time, a monotone floor in the
# proxy tier, a deepest-confirmed slot, and persistent-vacancy mode 34, which
# drives them.
#
# Off by default, and the default build is byte-identical: the schedule is one
# `Option` field on `GeneralRelaxedSettings` that does not exist when the
# feature is off, one `#[cfg]`-paired call at the top of `move_sweep` whose
# disabled half has no body, and one match arm in the mode dispatch. Every
# existing caller constructs the settings without naming it, so `move_sweep`
# reads `state.strip_depth_mm` exactly as it does today and the four pinned
# gates reproduce bit-for-bit.
#
# It is not a bit-identical *behaviour* flag when armed: an armed lane writes a
# tightening depth into the state at every sweep entry, which changes the
# boundary penalty, the candidate sampling boxes and therefore the trajectory.
# That is the whole point of it, and it is why arming it needs a matched-arm
# quality gate rather than a document diff. See
# `search::compression_schedule` and docs/experiments/compression-schedule/.
compression-schedule = []
# Occupies the seven worker lanes a mode-34 arm leaves idle: the same depth
# clock, driven by W workers instead of one.
#
# Stacked on `compression-schedule` and off by default. It compiles in two
# independent levers, each with its own spec key and each priced separately in
# docs/experiments/parallel-compression-schedule/:
#
#   `lanes=W`    the repair half. On a step whose proxy tier is infeasible, W
#                workers each repair a private clone of the frontier under the
#                *same* global depth, from per-(step, worker) derived seeds,
#                and a reduce in worker-index order adopts the best. The clock,
#                the monotone floor, the deepest-confirmed slot and the
#                confirmation cadence stay where they were - a worker never
#                steps the schedule and never confirms.
#   `pconfirm=1` the confirmation half. One whole-layout exact validation, its
#                61 collision-polygon builds and its 1,830 pair questions
#                spread over the job pool, reduced on the lowest violating pair
#                index so the verdict and its message are the serial ones.
#
# Both are deterministic by construction rather than by hope, which is the
# hard gate this feature was asked to clear: every worker's input is a function
# of (frontier, step, worker ordinal), the reduce is a total order whose final
# tiebreak is the worker index, and the counters are summed in that same order.
# Two processes in work-budget mode therefore produce the same document.
#
# `lanes` is NOT semantics-preserving when armed - a best-of-W repair takes a
# different trajectory than one lane's, and it charges W times the candidate
# queries - so it needs a matched-arm quality gate, not a document diff.
# `pconfirm` is semantics-preserving on every accepted confirmation and differs
# from the serial validator only in the `exactPairTests` a *refused* one
# charges; see the README's determinism section for the measured refusal rate.
#
# With the feature off none of it is compiled: the settings have no field
# naming either lever, the repair loop is the shipped serial one, and the four
# pinned gates reproduce bit-for-bit.
parallel-compression-schedule = ["compression-schedule"]
# Rotation as a *continuous degree of freedom inside the relaxed lane's own
# candidate loop* - design A of the continuous-rotation brief.
#
# The 2.5-degree `StructuredGrid` is the catalogue's angle quantum, and the
# record line's productive orientation rungs are 0.0032 / 0.008 / 0.00128
# degrees - three orders below it. This feature extends the coordinate-descent
# axis schedule with a rotation rung derived per piece, `dtheta = dx / r` (r the
# piece's bounding radius, dx the schedule's own live translation step), both
# signs, plus a mirror toggle as a discrete companion move. The surrogate for a
# continuous angle is built on demand through the same construction path
# `CurrentPoseOverlay` uses (`build_oriented_surrogate`, layered - never a
# catalogue clone) and cached in a lane-local map: a per-piece pinned slot for
# the pose the lane currently holds, plus a small bounded LRU for probes. The
# continuous angle space is never enumerated into the catalogue.
#
# Off by default, and the operator is compiled out entirely without it: the
# settings have no field naming it, `refine_candidate` has no rotation rung and
# no mirror axis, and nothing can populate the lane-local surrogate map. The one
# thing that stays compiled either way is the *resolution fallback* -
# `resolve_surrogate` consults the lane-local map after the catalogue misses -
# because a `#[cfg]` cannot be put on a function parameter and two copies of the
# candidate scan's hot loop would be free to drift. With the feature off that
# map is provably empty (its only insert site is behind this `#[cfg]`), so the
# fallback is a null-root probe on the path where today's code raises
# `missing_orientation` and nowhere else; the four pinned gates reproduce
# bit-for-bit as whole documents.
#
# It is NOT semantics-preserving when armed: a rotation rung is a candidate the
# lane could not previously propose, and it costs a surrogate build on a cache
# miss. It therefore needs a matched-arm quality gate, not a document diff. See
# docs/experiments/continuous-rotation/.
continuous-rotation = []
# A diagnostic-only companion to `general_micro_legalization`'s translation-only
# global program. It asks a different question from the repair pass: not "can
# this front be pushed open at all" but "how much shallower can the PUBLISHED
# depth be made, by a bounded SE(2) motion of every piece, without breaking
# anything else". See `search::general_micro_legalization::se2_certificate` and
# docs/experiments/se2-rigidity/.
#
# Off by default, and the default build contains none of it: the whole module is
# behind this `#[cfg]`, and the only thing it needs from the shipping path is
# `Approach`'s witness pair, which is itself behind the same gate so that
# neither the struct's size nor `measure_approach`'s work changes in a default
# build. `global_legalize` shares no code with the certificate's solver and no
# production path calls it.
#
# It never runs inside a request even when compiled in: the only caller is a
# CLI branch in `general_request_benchmark`, gated on the
# `POLYGON_NESTING_SE2_CERTIFICATE` environment variable exactly the way
# `POLYGON_NESTING_COMPRESSION_SCHEDULE` gates mode 34's knobs, so an armed
# build run without it is the shipping benchmark. The four pinned gates are run
# on both binaries to hold that.
se2-rigidity-certificate = []
# Sol review 10 §3's new search action: the active-contact block SE(2) operator.
# Build the graph of near-binding contacts touching the depth-setting pieces,
# take a small connected component containing the setter, and propose one joint
# `(dx, dy, dtheta)` for the whole block inside a trust region — then apply it as
# ONE action, validated exactly, and re-derive the graph and repeat.
#
# Stacked on `se2-rigidity-certificate` because it reuses that module's geometry
# and its exact closest-approach witness pair, which is itself behind that gate
# so a default build's `Approach` neither grows nor does extra work. It is NOT
# the same program: the certificate solves the whole layout at one small radius
# in one shot, and this restricts to five pieces so it can afford a large radius
# and sequential re-linearization. See
# `search::general_micro_legalization::contact_block` and
# docs/experiments/contact-block/.
#
# Off by default, off in every shipping path, and reachable only through the
# `POLYGON_NESTING_CONTACT_BLOCK` environment variable on the benchmark's
# diagnostic door — so an armed build run without it is the shipping benchmark,
# which the four pinned gates are run on both binaries to hold.
contact-block-se2 = ["se2-rigidity-certificate"]
# A sound broad phase for the exact-clearance contract validator's all-pairs
# loop, `validation::general_polygon::validate_publication`.
#
# docs/experiments/parallel-compression-schedule/ §3 measured where a mode-34
# confirmation's milliseconds are and found 97.9% of them in that loop: `n(n-1)/2`
# calls to `minimum_boundary_distance`, each walking every edge of one material
# set against every edge of the other, with no broad phase of any kind. This
# feature adds one.
#
# It is sound rather than approximate, and the distinction is the whole design.
# The loop's *only* consumer reads a threshold verdict - `distance.is_finite() &&
# distance >= pair_clearance` - and never the distance itself; the value is
# module-private and has exactly one call site. So a prefilter may skip a pair
# only when it PROVES that verdict would have been "clear", which is what
# `ClearanceSlabs` does: four separating-axis projections in the validator's own
# untouched-`f64` millimetres, with a margin that dominates every rounding error
# on both sides of the comparison. It is never allowed to be wrong about "these
# are far apart"; it is allowed to be uninformative, and then the exact loop runs
# unchanged.
#
# It deliberately does NOT reuse `GridSlabs`, whose projections live on the
# canonical *integer* grid. That is the quantized geometry this module exists not
# to read - a validator built on it cannot see a sub-grid violation - so its
# certificate, though sound for its own question, would import exactly the
# blindness the exact validator is for.
#
# Off by default. With the feature off none of it is compiled and the loop is the
# shipped one. With it on the verdict is unchanged on every input, so the four
# pinned gates reproduce bit-for-bit in BOTH states - which is the gate this
# feature is held to, and the reason it carries no document-visible counter of
# its own. See docs/experiments/fast-contract-validator/.
fast-contract-validator = []
# The decomposition instrument for the continuous-rotation operator's wall tax,
# and *only* an instrument: it adds counters and timed regions to the armed
# lane, reports them on stderr, and is never compiled into a binary that carries
# a wall claim.
#
# docs/experiments/continuous-rotation/ §3 measured a 2.2x per-slice wall on an
# armed lane and could attribute only a sixth of it to surrogate builds; the
# other five sixths were *inferred* to be the resolution tax of its §1.2. Both
# halves of that turned out to be wrong, and for the same reason: the operator
# is armed on modes 22 **and** 34 and `rotation_surrogate_builds` is only
# reported on a mode-34 slice, so 85% of the builds were invisible. This feature
# is what counts them. It tags every pose resolution by which of the two maps
# answered it, counts every step of the two deque linear scans that round's §6
# named, times `build_oriented_surrogate` stage by stage, and counts the
# operator's own entry points.
#
# Off by default and stacked on `continuous-rotation`, whose sites it
# instruments. The counters are per-thread blocks summed at exit, like
# `profiling::ThreadProfile`, and never read by a search decision - the first
# version used one shared atomic array and was slow enough that the coordinator
# stopped reaching a mode-34 slice, which is the measurement that says why a
# wall battery is run on a build without this. See
# docs/experiments/rotation-tax/ §1.
rotation-tax-census = ["continuous-rotation"]
# The witness-driven, clamp-triggered form of the continuous-rotation operator,
# plus the equivariant-offset construction its per-rung price turns on.
#
# docs/experiments/rotation-tax/ §4 measured design A - a rotation axis in every
# refinement descent, every piece, every slice - at **+6.735 mm worse** on
# mixed-61 at a ten-second wall, and §1 said why: 1.13M surrogate builds, 79% of
# them compulsory misses, 81.4% of each build one `ClipperOffset` call. Two
# reviews converged on the same two verdicts - blanket arming is dead on the
# wall, and a sparse form pays the same per-rung price unless the build cost is
# fixed first - so this feature carries both halves:
#
# * **the equivariant lever.** A miter-join offset is rotation-equivariant, so
#   the operator offsets each piece *once* and derives every rung by
#   transforming the already-offset ring. It is NOT bit-identical to the
#   per-rung offset - the two orders round differently on Clipper's integer grid
#   - so it is a distinct operator geometry and carries its own matched-arm
#   quality battery rather than an answer-preservation claim;
# * **sparse arming.** Rotation is proposed only for the pieces a stalled
#   compression-schedule step names through its own violating-pair queue, and
#   only while that step's translation repair is not making progress.
#
# Off by default, stacked on `continuous-rotation` (whose lane, cache, rung
# derivation and residency guard it reuses in full) and further gated by three
# runtime spec keys - `roteq`, `sparserot` and `rotbit` - so one binary can hold
# every arm of the battery. See docs/experiments/sparse-rotation/.
sparse-rotation = ["continuous-rotation"]
# Gate A's shadow instrument (Grok review 6 §2): run the contract-only
# validator, the composite miter validator, and an experimental round-join
# variant of the same envelope over one imported pose set, and report the
# per-pair and per-boundary slacks rather than three booleans.
#
# Off by default and reachable from nothing. It compiles in
# `search::import_gate`, one extra `PolygonSet` method that takes the join type
# as an argument (`offset_with_join_shadow` — `PolygonSet::offset` itself is
# untouched, and the shadow asserts at run time that its miter configuration
# reproduces it), and two measurement accessors on the contract validator that
# return the distances the real loop already computes without the comparison.
# No search path, scorer or publication route names any of them, so a build
# without this feature is the shipping engine exactly, and a build *with* it
# reaches the round join only from the `sparrow_import_gate` example.
#
# It is a diagnostic, not a candidate authority: Clipper's round join inscribes
# its arcs, so a round envelope UNDER-approximates `P (+) disc(r)` and could
# accept what the disc refuses. Promotion would need Sol review 11's
# outward-only discretisation with the error inside the margin. See
# docs/experiments/gate-a-sparrow-import/.
import-gate-shadow = []
# The certified round-envelope kernel: the composite's envelope half decided as
# `P (+) disc(r)` in exact integer arithmetic on the canonical grid, instead of
# as a Clipper miter offset at `CLIPPER_MITER_LIMIT = 2.0`.
#
# docs/experiments/gate-a-sparrow-import/ priced the join it replaces: on one
# contract-legal 61-piece layout the miter envelope refuses 31 of 1830 pairs and
# 2 of 61 boundaries at the contract radius, every one of them caused by the
# join shape and none by the radius, at a median 0.5057 mm of material clearance
# on a refused pair. Sol review 11 named the replacement and Sol review 12 §3.2
# set its kills; Grok review 7 §2 kept them unmodified.
#
# It is exact rather than outward-discretized, and that is a correction to Sol's
# own specification rather than a shortcut around it: Gate A measured a pair with
# 0.42 µm of radius margin - below the 1 µm canonical grid step - which any
# outward polygonal approximation with the error charged to the margin must
# refuse. There is no approximating polygon here. Canonical rings are integers
# on a 1 µm grid, squared segment distances between them are rationals, and
# `d^2 >= (2r)^2` is one `i128` comparison after cross-multiplication. The
# verdict is a function of the integer grid alone: no rounding mode, no error
# budget, bit-identical across platforms.
#
# The material contract validator is NOT touched. Publication stays the
# conjunction it has always been; this feature replaces one half of it and the
# half it replaces is the only half it can reach.
#
# Off by default at compile time, and **off by default at run time even when
# compiled** - unlike `fast-contract-validator`, whose certificate is
# verdict-preserving and therefore defaults to armed. This one changes the
# acceptance authority, so it is armed only by the v3 coordinator, only for the
# duration of one run, only when the `rek` spec key asks, and through an RAII
# guard that puts the previous value back. A build without the feature refuses
# the key rather than running the miter arm under a round label. See
# docs/experiments/round-envelope-kernel/.
round-envelope-kernel = []
# The skip pile diagnostic's dump hook, and nothing else.
#
# `CompressionSchedule::due_for_confirmation` refuses to ask the exact tier
# about a frontier the *relaxed surrogate* already calls infeasible, and the
# surrogate's collision geometry is the production miter offset. The
# round-envelope gate measured what that costs in visibility:
# `confirmationsRefused = 0` on all 108 runs of its twelve-parent matched gate,
# because 149 762 frontiers were suppressed one level above the confirmation and
# never reached it. This feature writes those frontiers out as poses so the disc
# kernel and the material contract can be asked about them.
#
# Instrument only. It adds one `cfg`-gated accessor to `CompressionSchedule`,
# one `cfg`-gated block after the confirmation branch of a schedule step, and
# one module that nothing in `src/` outside itself names. It returns nothing to
# the search and publishes no field. It implies `compression-schedule` because a
# hook on that schedule's own step has no meaning without it.
#
# Off at compile time, and off at run time even when compiled: the sink opens
# only when `POLYGON_NESTING_SKIP_PILE_DUMP` names a path. Its cost is wall, and
# every cell it is used on is work-capped - which is why an armed run has to
# reproduce the committed cell's step digest and skip count, and why the driver
# asserts that rather than asserting this comment. See
# docs/experiments/skip-pile-diagnostic/.
skip-pile-dump = ["compression-schedule"]
# The overlap-tolerant continuous engine (locked-strip-then-shrink ICS), as
# specified by docs/overlap-ics-converged-spec.md and Sol review 14 Round 2 §4.
#
# It is a *search* module that never quantizes a move: continuous `f64`
# `(x, y, theta)` over the unoffset source material, a signed convex gap as the
# only overlap measure, and exact geometry consulted **only** when a state is
# offered for publication. The integer round kernel is the publication judge and
# never participates in the continuous measure - which is why this feature
# implies `round-envelope-kernel` (the Exclusive pair/boundary predicates at the
# request's own radius) and `fast-contract-validator` (an acceleration of the
# same final contract verdict, never a different one).
#
# It must NOT imply `jagua-experimental`, `compression-schedule`, or anything in
# the relaxed/coordinator stack: the Chinese wall of this campaign is that
# `jagua-rs` stays out of the resolved dependency tree, and
# docs/experiments/overlap-ics/drivers/fast.sh fails the iteration if
# `cargo tree --features overlap-ics` ever names it.
#
# Off by default and reachable from nothing in `src/` outside its own module:
# the only driver is `examples/overlap_ics_benchmark.rs`, whose
# `required-features` are exactly this one. No portfolio route, no
# `ExplorationKernel`, no `GeneralRelaxedOutcome.result` - and none of those
# until the Round-2 gate in the converged spec passes.
overlap-ics = ["round-envelope-kernel", "fast-contract-validator"]
# The independently-authored conflict-cluster budget experiment. Off by
# default; it changes only the frozen order producer in overlap-ICS and has no
# route outside that engine. See docs/conflict-cluster-budget-spec.md.
conflict-cluster-budget = []
# The independently-authored minimum-conflict binary close experiment. Off by
# default; it changes only the explore-bite injection in overlap-ICS and has no
# route outside that engine. See docs/minimum-conflict-binary-close-spec.md.
minimum-conflict-binary-close = []
# Resets GLS weights only when an exploration-pool pose is restored before a
# topological disruption. Off by default; the unchanged Saved arm remains the
# control. See docs/pool-retry-tracker-rebase-spec.md.
pool-retry-tracker-rebase = []
# The overlap-ICS master-iteration phase census: nanosecond accumulators around
# slot preparation, thread dispatch/join, the worker sweeps, the ordinal merge
# and Algorithm-8 pass, and the exact attempt. **Measurement only, and off in
# every build any gate is measured on.**
#
# It is a feature rather than a runtime flag because of what the evidence audit
# verified about the default build: an `Instant` appears in exactly one place
# under `search/overlap_ics/`, `Pacer::Wall`, so a fixed-work trajectory cannot
# read a clock at all - which is what makes the two-process bit-identity a
# proof rather than a coincidence. With this feature off, that sentence stays
# literally true; the phase timers do not exist in the binary, and the only
# residue is one never-read `u64` per worker slot. With it on, the clock reads
# are still outside every decision - no field of `profile::PhaseProfile` is
# read by the engine - so the profiling build takes the same trajectory. The
# census asserts that rather than claiming it: see
# docs/experiments/overlap-ics/economics-round/census/.
ics-profile = []

[dependencies]
polygon-nesting-protocol = { path = "../polygon-nesting-protocol" }
num-bigint = "0.4"
libm = "0.2"
jagua-rs = { version = "=0.7.2", optional = true }
rayon = "1"
robust = "1.2.0"
ryu-js = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"

[[example]]
name = "general_hazard_benchmark"
path = "examples/general_hazard_benchmark.rs"
required-features = ["jagua-experimental"]

# The release-build shadow corpus for `fast-contract-validator`. It is an
# example rather than a test because the checking has to happen in a build with
# `debug_assertions` off - that is the profile the campaign measures and ships,
# and it is the one profile in which the filter's own `debug_assert` is absent.
# See docs/experiments/fast-contract-validator/ §4.4.
[[example]]
name = "contract_validator_shadow"
path = "examples/contract_validator_shadow.rs"
required-features = ["fast-contract-validator"]

# Gate A's driver: reads a request and an imported pose set, runs the three
# verdicts, and writes the slacks as JSON. An example for the same reason
# `contract_validator_shadow` is one - the measurement has to happen in a
# release build, against the same Clipper the campaign measures - and because
# nothing in the shipped crate may depend on it.
[[example]]
name = "sparrow_import_gate"
path = "examples/sparrow_import_gate.rs"
required-features = ["import-gate-shadow"]

# The round-envelope kernel's soundness battery. An example for the same reason
# `contract_validator_shadow` and `sparrow_import_gate` are examples - the
# measurement has to happen in a release build, against the same Clipper the
# campaign measures - and it needs `import-gate-shadow` as well as its own
# feature because the false-accept test is judged against the *contract
# validator's own* material distance, which that feature is what exposes. Asking
# a second distance function would be exactly how a soundness battery fakes
# itself.
[[example]]
name = "round_envelope_battery"
path = "examples/round_envelope_battery.rs"
required-features = ["round-envelope-kernel", "import-gate-shadow"]

# The skip pile diagnostic's scoring stage: the frontiers `skip-pile-dump` wrote
# out, re-asked of the material contract, of HEAD's miter authority and of the
# disc kernel. An example for the same reasons the three above are examples, and
# it needs the same two features they do - the composite verdicts come from
# `round_envelope_gate::wired_verdicts` and the material clearances from the
# contract validator's own accessor. It deliberately does NOT need
# `skip-pile-dump`: the writing binary and the scoring binary are different
# programs, and a scorer that could only be built beside the hook would be one
# more thing to keep in step. See docs/experiments/skip-pile-diagnostic/.
[[example]]
name = "skip_pile_score"
path = "examples/skip_pile_score.rs"
required-features = ["round-envelope-kernel", "import-gate-shadow"]

# The overlap-ICS vertical slice's only driver. An example for the same reason
# the four above are examples - the measurement has to happen in a release
# build, and nothing in the shipped crate may depend on it - and it carries
# exactly one required feature, which is the Chinese wall in the dependency
# graph: `overlap-ics` implies `round-envelope-kernel` and
# `fast-contract-validator` and nothing else, so this binary cannot be built
# with `jagua-experimental` by accident. See docs/experiments/overlap-ics/.
[[example]]
name = "overlap_ics_benchmark"
path = "examples/overlap_ics_benchmark.rs"
required-features = ["overlap-ics"]

# The economics round's currency cell: it derives `B/E/R/D` from census
# documents another process wrote and runs the spec's >10 % wall-prediction
# reject check. It reads JSON and prints JSON; it never constructs an engine,
# so it cannot influence a trajectory. The arithmetic lives in
# `search::overlap_ics_meter::currency` with its own unit vectors.
[[example]]
name = "ics_meter"
path = "examples/ics_meter.rs"
required-features = ["overlap-ics"]
